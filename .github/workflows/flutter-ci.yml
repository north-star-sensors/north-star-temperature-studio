name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter / Dart versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Riverpod, Isar, Mockito)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Guards against regressing web compatibility (e.g. importing dart:io or
      # an FFI-only package outside a conditional import).
      - name: Build web
        run: flutter build web
